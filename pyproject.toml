[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroimaging-maxent-analysis"
version = "0.1.0"
description = "Maximum-entropy and classifier analyses of binary connectivity representations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.12", "pandas>=2.2", "scikit-learn>=1.4", "torch>=2.2", "networkx>=3.2", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8"]
fast = ["numba>=0.60"]

[project.scripts]
neuroimaging-maxent = "neuroimaging_maxent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
